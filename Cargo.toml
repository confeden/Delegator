[package]
name = "delegator"
version = "0.7.0"
edition = "2021"
authors = ["Delegator contributors"]
description = "Portable Windows tray orchestrator for Gemini and OpenCode delegation"
readme = "README.md"
keywords = ["windows", "tray", "gemini", "opencode", "orchestrator"]
categories = ["development-tools", "gui"]
publish = false

[dependencies]
# UI and System Tray
eframe = "0.36.1"
# Same version eframe already depends on: needed to read the HWND.
raw-window-handle = "0.6"
egui = "0.29.1"
tray-icon = "0.19.0"

# Async and Networking
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# System and Windows DPAPI
directories = "5.0"
base64 = "0.22"
image = "0.25"

[build-dependencies]
winresource = "0.1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_System_Memory"
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
