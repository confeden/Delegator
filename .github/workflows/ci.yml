name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Validate Python modules
        run: |
          python -m compileall -q delegator_core run_server.py
          python -c "from delegator_core.main import app; assert app.title == 'Delegator Core'"

      - name: Run Python tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests -q

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw -Encoding UTF8))
          }

      - name: Check .ps1 files have UTF-8 BOM
        shell: pwsh
        run: |
          $bad = Get-ChildItem scripts -Filter *.ps1 | Where-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            -not ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Output "Missing UTF-8 BOM (PS 5.1 reads no-BOM as ANSI): $($_.Name)" }
            exit 1
          }

      - name: Check .ps1 files carry no control characters
        shell: pwsh
        run: |
          # A real BACKSPACE character sat inside a word-boundary regex in
          # ai-delegate.ps1 from the day it was written: the match never fired,
          # so every Pro model was ranked one tier too low and nothing failed
          # loudly. Parsing cannot catch it - the file is valid PowerShell.
          $bad = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $found = $bytes | Where-Object { $_ -lt 9 -or $_ -eq 11 -or $_ -eq 12 -or ($_ -ge 14 -and $_ -le 31) }
            if ($found) { $bad += "$($_.Name): $(@($found | Select-Object -Unique) -join ',')" }
            # A BARE carriage return - one not followed by a newline - is the
            # same trap wearing a legal byte: an escape that became a literal.
            # It has now produced three separate defects (a regex that never
            # matched, a path that did not exist, a comment cut in half).
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            if ($text -replace "`r`n", '' -match "`r") { $bad += "$($_.Name): bare CR" }
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Output "Control character in a script (an escape that became a literal): $_" }
            exit 1
          }
      - name: Audit source package
        shell: pwsh
        run: .\scripts\audit-release.ps1
