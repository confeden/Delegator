[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delegator-core"
dynamic = ["version"]
description = "Local chat-orchestrator core for Delegator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[tool.setuptools]
packages = ["delegator_core", "delegator_core.providers"]

[tool.setuptools.dynamic]
version = {attr = "delegator_core.__version__"}

[project.scripts]
delegator-core = "delegator_core.main:run"
